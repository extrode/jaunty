version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.Bcl.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
      db-providers:
        patterns:
          - "Microsoft.Data.*"
          - "Npgsql*"
          - "MySql*"
          - "SQLitePCLRaw*"
          - "SourceGear.sqlite3"
          - "DuckDB.NET*"
    ignore:
      # Roslyn pins define the MINIMUM compiler the source generator supports;
      # bumping them drops older SDK consumers. Bump deliberately, not via bot.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"
      # The net8.0 pin stays on the 8.0 line (8.0.2 is patched); 9.0.18 carries
      # two advisories and NuGet audit warnings are errors here.
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
