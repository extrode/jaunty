name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every push to dev ran CI twice: once for the push, and once as a pull_request
# sync of the standing dev -> main PR (#18), whose head branch is dev itself.
# Concurrency cannot collapse the pair - github.ref is refs/heads/dev for one
# and refs/pull/18/merge for the other, so they occupy different groups - and
# the trigger cannot either, because pull_request.branches filters the BASE
# branch, not the head. Hence a job-level condition.
#
# pull_request runs are skipped when the head branch is one that push already
# covers. A feature or dependabot PR into dev still runs, which is the case that
# matters: pushes only fire on dev and main, so skipping those PRs would leave
# them untested. Branch protection is unaffected - the head SHA is identical, so
# the push run's checks appear on the PR as the same commit's checks.

# The SQL Server service uses a throwaway credential for the ephemeral CI
# container only. Override with the CI_MSSQL_SA_PASSWORD repository variable
# if desired.
jobs:
  build-and-test:
    name: Build & Test
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref != 'dev' &&
       github.event.pull_request.head.ref != 'main')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ vars.CI_MSSQL_SA_PASSWORD || 'JauntyCi2026#x' }}
        ports:
          - 1435:1433
        volumes:
          # Mirror the workspace path: BULK INSERT runs server-side and the
          # CSV import tests pass host paths to the server.
          - ${{ github.workspace }}:${{ github.workspace }}
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      CI_SA_CRED: ${{ vars.CI_MSSQL_SA_PASSWORD || 'JauntyCi2026#x' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Bootstrap SQL Server Northwind
        run: |
          docker cp data/sqlserver/create-northwind.sql ${{ job.services.mssql.id }}:/tmp/nw.sql
          docker cp data/sqlserver/create-stored-procedures.sql ${{ job.services.mssql.id }}:/tmp/sp.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_CRED" -C -i /tmp/nw.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_CRED" -C -d Northwind -i /tmp/sp.sql

      - name: Restore
        run: dotnet restore Jaunty.slnx

      # --no-incremental because ILLink/AOT analysis only runs on a clean compile: an
      # incremental build on this self-hosted runner's persistent workspace reported 0
      # diagnostics where a clean build of the same tree reported 4 (spec 010, AC2).
      - name: Build
        run: dotnet build Jaunty.slnx -c Release --no-restore --no-incremental

      - name: Test - Core (SQLite + SQL Server)
        env:
          JAUNTY_TEST_SQLSERVER: Server=localhost,1435;Database=Northwind;User Id=sa;Password=${{ vars.CI_MSSQL_SA_PASSWORD || 'JauntyCi2026#x' }};TrustServerCertificate=true;
        run: >-
          dotnet test tests/Jaunty.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-core.trx"

      - name: Test - Source Generator (shape safety)
        run: >-
          dotnet test tests/Jaunty.SourceGenerator.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-sourcegen.trx"

      - name: Test - Fluent
        run: >-
          dotnet test tests/Jaunty.Fluent.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-fluent.trx"

      # Split out of Jaunty.Fluent.Tests so that suite can run its collections in parallel.
      # These tests mutate the process-global JauntyConfig; keep them in their own serial run.
      - name: Test - Fluent config state
        run: >-
          dotnet test tests/Jaunty.Fluent.ConfigTests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-fluent-config.trx"

      # Named projects, not a solution-wide run: every test project needs its own step
      # here or it never executes in CI. Jaunty.Fluent.SourceGen.Tests and
      # Jaunty.Scaffolding.Cli.Tests had no step and ran nowhere until 2026-08-01.
      # tests/Jaunty.Tests/Unit/SolutionLayoutTests.cs guards the solution file; this
      # list is the second half of the same contract and has to be extended by hand.
      - name: Test - Fluent source-gen (no reflection package reference)
        run: >-
          dotnet test tests/Jaunty.Fluent.SourceGen.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-fluent-sourcegen.trx"

      - name: Test - Scaffolding
        run: >-
          dotnet test tests/Jaunty.Scaffolding.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-scaffolding.trx"

      - name: Test - Scaffolding CLI
        run: >-
          dotnet test tests/Jaunty.Scaffolding.Cli.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-scaffolding-cli.trx"

      - name: Test - FlatFiles (DuckDB)
        run: >-
          dotnet test Jaunty.slnx
          -c Release
          --no-build
          --framework net8.0
          --filter "FullyQualifiedName~Jaunty.FlatFiles"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-flatfiles.trx"

      # net10 legs (spec 010 T18): duplicated steps, deliberately NOT a job matrix -
      # the runner is self-hosted and a matrix re-spins the SQL Server service
      # container per leg. These also carry the T13 loader assertion, which fails
      # if a net10 leg silently loads a net8-compiled Jaunty.dll.
      - name: Test - Core net10 (SQLite + SQL Server)
        env:
          JAUNTY_TEST_SQLSERVER: Server=localhost,1435;Database=Northwind;User Id=sa;Password=${{ vars.CI_MSSQL_SA_PASSWORD || 'JauntyCi2026#x' }};TrustServerCertificate=true;
        run: >-
          dotnet test tests/Jaunty.Tests
          -c Release
          --no-build
          --framework net10.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-core-net10.trx"

      - name: Test - Source Generator net10 (shape safety)
        run: >-
          dotnet test tests/Jaunty.SourceGenerator.Tests
          -c Release
          --no-build
          --framework net10.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-sourcegen-net10.trx"

      - name: Test - Fluent net10
        run: >-
          dotnet test tests/Jaunty.Fluent.Tests
          -c Release
          --no-build
          --framework net10.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-fluent-net10.trx"

      - name: Test - Fluent config state net10
        run: >-
          dotnet test tests/Jaunty.Fluent.ConfigTests
          -c Release
          --no-build
          --framework net10.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-fluent-config-net10.trx"

      - name: Test - Fluent source-gen net10 (no reflection package reference)
        run: >-
          dotnet test tests/Jaunty.Fluent.SourceGen.Tests
          -c Release
          --no-build
          --framework net10.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-fluent-sourcegen-net10.trx"

      - name: Test - Scaffolding net10
        run: >-
          dotnet test tests/Jaunty.Scaffolding.Tests
          -c Release
          --no-build
          --framework net10.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-scaffolding-net10.trx"

      - name: Test - Scaffolding CLI net10
        run: >-
          dotnet test tests/Jaunty.Scaffolding.Cli.Tests
          -c Release
          --no-build
          --framework net10.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-scaffolding-cli-net10.trx"

      - name: Test - FlatFiles net10 (DuckDB)
        run: >-
          dotnet test Jaunty.slnx
          -c Release
          --no-build
          --framework net10.0
          --filter "FullyQualifiedName~Jaunty.FlatFiles"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-flatfiles-net10.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results-*.trx"
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/coverage.cobertura.xml"
          retention-days: 7

  verify-aot:
    name: Verify NativeAOT Compatibility
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref != 'dev' &&
       github.event.pull_request.head.ref != 'main')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run NativeAOT verification
        run: pwsh scripts/Verify-NativeAOT.ps1

  # No duplicate-run condition here, deliberately. `needs` already skips this job
  # when build-and-test is skipped, and an explicit `if` would REPLACE the
  # implicit success() check on that dependency - which would let the publish
  # start after a failed test run.
  aot-publish:
    name: NativeAOT Publish
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install native AOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # PublishAot lives in the Cli csproj. Passing it as -p: makes it a
      # GLOBAL property that flows into referenced projects, and the
      # netstandard2.0 source generator then fails with NETSDK1207
      # (AOT unsupported for that target framework).
      #
      # Two legs since spec 010 (T19): net8 is the CONTROL, net10 the migration
      # under test. -f is now required - the Cli multi-targets net8.0;net10.0,
      # and a framework-less publish of a multi-target project fails outright.
      - name: Publish NativeAOT (net8 control)
        run: >-
          dotnet publish
          src/Jaunty.Scaffolding.Cli/Jaunty.Scaffolding.Cli.csproj
          -c Release
          -f net8.0
          -r linux-x64
          --self-contained
          -o ./publish-aot-net8

      - name: Publish NativeAOT (net10)
        run: >-
          dotnet publish
          src/Jaunty.Scaffolding.Cli/Jaunty.Scaffolding.Cli.csproj
          -c Release
          -f net10.0
          -r linux-x64
          --self-contained
          -o ./publish-aot-net10

      - name: Verify AOT binaries
        run: |
          fail=0
          for leg in net8 net10; do
            bin="./publish-aot-$leg/Jaunty.Scaffolding.Cli"
            if [ -f "$bin" ]; then
              SIZE=$(stat --format="%s" "$bin")
              SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
              echo "$leg: AOT binary produced, ${SIZE_MB} MB"
            else
              echo "ERROR: $leg AOT binary not found"
              ls -la "./publish-aot-$leg/" || true
              fail=1
            fi
          done
          exit $fail
