name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Jaunty.slnx

      - name: Build
        run: dotnet build Jaunty.slnx -c Release --no-restore

      - name: Test - Core (SQLite)
        run: >-
          dotnet test Jaunty.slnx
          -c Release
          --no-build
          --framework net8.0
          --filter "FullyQualifiedName~Sqlite"
          --logger "trx;LogFileName=test-results-core.trx"

      - name: Test - FlatFiles (DuckDB)
        run: >-
          dotnet test Jaunty.slnx
          -c Release
          --no-build
          --framework net8.0
          --filter "FullyQualifiedName~Jaunty.FlatFiles"
          --logger "trx;LogFileName=test-results-flatfiles.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results-*.trx"
          retention-days: 7

  verify-aot:
    name: Verify NativeAOT Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run NativeAOT verification
        run: pwsh scripts/Verify-NativeAOT.ps1

  aot-publish:
    name: NativeAOT Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install native AOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish NativeAOT
        run: >-
          dotnet publish
          src/Jaunty.Scaffolding.Cli/Jaunty.Scaffolding.Cli.csproj
          -c Release
          -r linux-x64
          -f net8.0
          --self-contained
          -p:PublishAot=true
          -p:IsTrimmable=true
          -p:TargetFrameworks=net8.0
          -o ./publish-aot

      - name: Verify AOT binary
        run: |
          if [ -f ./publish-aot/Jaunty.Scaffolding.Cli ]; then
            SIZE=$(stat --format="%s" ./publish-aot/Jaunty.Scaffolding.Cli)
            SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
            echo "AOT binary produced successfully"
            echo "Binary size: ${SIZE_MB} MB"
          else
            echo "ERROR: AOT binary not found"
            ls -la ./publish-aot/ || true
            exit 1
          fi
