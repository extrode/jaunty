name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Every step here is checkout / setup-dotnet / cache / upload-artifact, none of
# which writes through GITHUB_TOKEN. This matters more once the repository is public: without an
# explicit block the token inherits the repository default, which may be read/write.
permissions:
  contents: read

# Every push to dev ran CI twice: once for the push, and once as a pull_request
# sync of the standing dev -> main PR (#18), whose head branch is dev itself.
# Concurrency cannot collapse the pair - github.ref is refs/heads/dev for one
# and refs/pull/18/merge for the other, so they occupy different groups - and
# the trigger cannot either, because pull_request.branches filters the BASE
# branch, not the head. Hence a job-level condition.
#
# pull_request runs are skipped when the head branch is one that push already
# covers. A feature or dependabot PR into dev still runs, which is the case that
# matters: pushes only fire on dev and main, so skipping those PRs would leave
# them untested. Branch protection is unaffected - the head SHA is identical, so
# the push run's checks appear on the PR as the same commit's checks.

# A pull request from a FORK never runs on the self-hosted runner. `vars` - unlike `secrets` -
# are readable by fork-PR runs, so a bare `vars.CI_RUNNER` would place an outside contributor's
# code on the maintainer's own machine, gated only by GitHub's approval-for-first-time-contributors
# default, which stops applying once that contributor has one merged PR. Forks get a hosted runner;
# everything else keeps the self-hosted one. Repeated on all three jobs rather than factored into
# an env, because `runs-on` is evaluated before `env` is available.
#
# Every service credential below is the same throwaway-per-run pattern: derived from
# github.run_id, which is unique per run and public - the point is that no fixed credential sits
# in a public file for a scanner to find, not that this one is a secret. Override with the
# matching CI_*_PASSWORD repository variable if desired. SQL Server's form must additionally
# satisfy its password policy: 8+ characters from three of upper, lower, digit, symbol - the
# others have no such requirement but share the format for consistency.
#
# Every service port binds to loopback. A self-hosted runner publishes container ports on its own
# host, and 0.0.0.0 would expose the engine to that machine's network for the life of the job.
#
# Ports are offset from both each engine's default AND from this repo's own docker-compose.yml
# (mssql 1433->1435, postgres 5432->5434, mysql/mariadb 3306->3309/3310). The self-hosted runner
# is a developer's own machine, which - per docs/reports - routinely has its own
# long-lived torture-{postgres,mysql,mariadb} containers bound to docker-compose.yml's ports
# (5433/3308/3307) for local dev-box testing. Binding CI's ephemeral containers to those same
# ports would collide with them rather than fail cleanly, exactly the trap the pre-existing mssql
# offset (1433->1435, avoiding a native SQL Server install) already existed to avoid.
jobs:
  build-and-test:
    name: Build & Test
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref != 'dev' &&
       github.event.pull_request.head.ref != 'main')
    runs-on: ${{ (github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.fork)
                 && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ vars.CI_MSSQL_SA_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
        ports:
          - "127.0.0.1:1435:1433"
        volumes:
          # Mirror the workspace path: BULK INSERT runs server-side and the
          # CSV import tests pass host paths to the server.
          - ${{ github.workspace }}:${{ github.workspace }}
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
          # Pre-created so the bootstrap step below can connect straight to it - the seed script
          # itself (data/postgres/create-northwind.sql) assumes the target database already
          # exists, same as it does against torture-postgres locally.
          POSTGRES_DB: northwind
        ports:
          - "127.0.0.1:5434:5432"
        # -h 127.0.0.1, not the bare default: these entrypoints run a temporary --skip-networking
        # (socket-only) server first to apply MYSQL_DATABASE/POSTGRES_DB and the root password,
        # then restart as the real one. A socket-routed probe (pg_isready/mysqladmin with no -h,
        # or -h localhost against mysql/mariadb) can report healthy against that temporary server,
        # before the seeded database or credentials the bootstrap step below needs actually exist.
        # Forcing TCP fails during that window instead of racing it.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ vars.CI_MYSQL_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
          MYSQL_DATABASE: northwind
        ports:
          - "127.0.0.1:3309:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
      # mariadb:11, not mysql:8's client names: unlike the mysql image, MariaDB's own image is not
      # guaranteed to ship the mysql*-named compat binaries. scripts/reset-test-databases.ps1 and
      # scripts/cleanup/benchmark-databases.ps1 already select mariadb/mariadb-admin specifically
      # for this same image; matched here rather than assuming mysqladmin/mysql also exist in it.
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ${{ vars.CI_MARIADB_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
          MARIADB_DATABASE: northwind
        ports:
          - "127.0.0.1:3310:3306"
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      CI_SA_CRED: ${{ vars.CI_MSSQL_SA_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
      CI_PG_CRED: ${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
      CI_MYSQL_CRED: ${{ vars.CI_MYSQL_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
      CI_MARIADB_CRED: ${{ vars.CI_MARIADB_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Bootstrap SQL Server Northwind
        run: |
          docker cp data/sqlserver/create-northwind.sql ${{ job.services.mssql.id }}:/tmp/nw.sql
          docker cp data/sqlserver/create-stored-procedures.sql ${{ job.services.mssql.id }}:/tmp/sp.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_CRED" -C -i /tmp/nw.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_CRED" -C -d Northwind -i /tmp/sp.sql

      # No -h/PGPASSWORD needed: docker exec runs psql inside the container itself, which
      # connects over the default Unix socket rather than TCP, and the official postgres image's
      # default pg_hba.conf trusts local socket connections unconditionally. Only the test suite's
      # TCP connection through the published port (below) needs CI_PG_CRED.
      - name: Bootstrap PostgreSQL Northwind
        run: |
          docker cp data/postgres/create-northwind.sql ${{ job.services.postgres.id }}:/tmp/nw.sql
          docker cp data/postgres/create-stored-procedures.sql ${{ job.services.postgres.id }}:/tmp/sp.sql
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d northwind -v ON_ERROR_STOP=1 -f /tmp/nw.sql
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d northwind -v ON_ERROR_STOP=1 -f /tmp/sp.sql

      - name: Bootstrap MySQL Northwind
        run: |
          docker cp data/mysql/create-northwind.sql ${{ job.services.mysql.id }}:/tmp/nw.sql
          docker cp data/mysql/create-stored-procedures.sql ${{ job.services.mysql.id }}:/tmp/sp.sql
          docker exec ${{ job.services.mysql.id }} mysql -uroot -p"$CI_MYSQL_CRED" northwind -e "SOURCE /tmp/nw.sql"
          docker exec ${{ job.services.mysql.id }} mysql -uroot -p"$CI_MYSQL_CRED" northwind -e "SOURCE /tmp/sp.sql"

      # Same seed scripts as MySQL: data/mysql/create-northwind.sql targets MySQL-compatible
      # syntax that MariaDB accepts as-is, same as TestConfiguration aliasing the two connection
      # strings onto each other when only one is configured on a dev box. Client is `mariadb`, not
      # `mysql` - see the mariadb service definition's comment above.
      - name: Bootstrap MariaDB Northwind
        run: |
          docker cp data/mysql/create-northwind.sql ${{ job.services.mariadb.id }}:/tmp/nw.sql
          docker cp data/mysql/create-stored-procedures.sql ${{ job.services.mariadb.id }}:/tmp/sp.sql
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -p"$CI_MARIADB_CRED" northwind -e "SOURCE /tmp/nw.sql"
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -p"$CI_MARIADB_CRED" northwind -e "SOURCE /tmp/sp.sql"

      - name: Restore
        run: dotnet restore Jaunty.slnx

      # --no-incremental because ILLink/AOT analysis only runs on a clean compile: an
      # incremental build on this self-hosted runner's persistent workspace reported 0
      # diagnostics where a clean build of the same tree reported 4 (spec 010, AC2).
      - name: Build
        run: dotnet build Jaunty.slnx -c Release --no-restore --no-incremental

      # PostgreSQL and SqlServer are exercised here directly (Postgres/SqlServer attributes read
      # their own connection strings). MariaDB is too, but via JAUNTY_TEST_MARIADB alone -
      # MariaDBAttribute.IsAvailable/DialectReachability only ever read
      # TestConfiguration.MariaDbConnectionString, never MySqlConnectionString, so a
      # JAUNTY_TEST_MYSQL here would sit unused; it belongs on the Scaffolding step instead, whose
      # MySqlSchemaReaderTests is the one thing in this repo that targets mysql:8 specifically.
      # JAUNTY_REQUIRE_MYSQL still applies here: it is MariaDBAttribute's own RequireVariable
      # (DialectReachability.RequireMySql - "one name for both engines"), so it gates the MariaDB
      # container it's paired with here just as much as it gates MySQL on the Scaffolding step.
      - name: Test - Core (SQLite + SQL Server + PostgreSQL + MariaDB)
        env:
          JAUNTY_TEST_SQLSERVER: Server=localhost,1435;Database=Northwind;User Id=sa;Password=${{ vars.CI_MSSQL_SA_PASSWORD || format('Ci#{0}xJ', github.run_id) }};TrustServerCertificate=true;
          JAUNTY_TEST_POSTGRESQL: Host=localhost;Port=5434;Database=northwind;Username=postgres;Password=${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }};
          JAUNTY_TEST_MARIADB: Server=localhost;Port=3310;Database=northwind;Uid=root;Pwd=${{ vars.CI_MARIADB_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }};SslMode=Disabled;AllowLoadLocalInfile=true;AllowPublicKeyRetrieval=true
          # The mssql/postgres/mariadb service containers are provisioned above, so an unreachable
          # engine here is a broken job rather than a machine without it. Without these the dialect
          # rows would skip and the leg would report green having tested SQLite only.
          JAUNTY_REQUIRE_SQLSERVER: "1"
          JAUNTY_REQUIRE_POSTGRESQL: "1"
          JAUNTY_REQUIRE_MYSQL: "1"
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Tests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-core.trx

      # The parallel half of Extrode.Jaunty.Tests. No live engine and no global-config mutation, so it
      # runs its collections concurrently and needs none of the service containers above.
      - name: Test - Core unit (parallel)
        run: >-
          dotnet test --project tests/Extrode.Jaunty.UnitTests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-core-unit.trx

      - name: Test - Source Generator (shape safety)
        run: >-
          dotnet test --project tests/Extrode.Jaunty.SourceGenerator.Tests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-sourcegen.trx

      - name: Test - Fluent
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Fluent.Tests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-fluent.trx

      # Split out of Extrode.Jaunty.Fluent.Tests so that suite can run its collections in parallel.
      # These tests mutate the process-global JauntyConfig; keep them in their own serial run.
      - name: Test - Fluent config state
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Fluent.ConfigTests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-fluent-config.trx

      # Named projects, not a solution-wide run: every test project needs its own step
      # here or it never executes in CI. Extrode.Jaunty.Fluent.SourceGen.Tests and
      # Extrode.Jaunty.Scaffolding.Cli.Tests had no step and ran nowhere until 2026-08-01.
      # tests/Extrode.Jaunty.UnitTests/Unit/SolutionLayoutTests.cs guards the solution file; this
      # list is the second half of the same contract and has to be extended by hand.
      - name: Test - Fluent source-gen (no reflection package reference)
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Fluent.SourceGen.Tests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-fluent-sourcegen.trx

      - name: Test - Scaffolding
        env:
          JAUNTY_TEST_SQLSERVER: Server=localhost,1435;Database=Northwind;User Id=sa;Password=${{ vars.CI_MSSQL_SA_PASSWORD || format('Ci#{0}xJ', github.run_id) }};TrustServerCertificate=true;
          JAUNTY_TEST_POSTGRESQL: Host=localhost;Port=5434;Database=northwind;Username=postgres;Password=${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }};
          # AllowPublicKeyRetrieval is required by MySqlConnector (this project's driver) against
          # MySQL 8's default auth plugin over an unencrypted connection.
          JAUNTY_TEST_MYSQL: Server=localhost;Port=3309;Database=northwind;Uid=root;Pwd=${{ vars.CI_MYSQL_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }};SslMode=Disabled;AllowLoadLocalInfile=true;AllowPublicKeyRetrieval=true
          JAUNTY_REQUIRE_SQLSERVER: "1"
          JAUNTY_REQUIRE_POSTGRESQL: "1"
          JAUNTY_REQUIRE_MYSQL: "1"
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Scaffolding.Tests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-scaffolding.trx

      - name: Test - Scaffolding CLI
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Scaffolding.Cli.Tests
          -c Release
          --no-build
          --framework net8.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-scaffolding-cli.trx

      - name: Test - FlatFiles (DuckDB)
        # Two --project runs, not --solution + --filter-namespace: the MTP-based runner
        # exits 8 ("zero tests ran") for every project in the solution the namespace
        # filter excludes, and dotnet test counts that as an error per project even
        # though the FlatFiles projects themselves pass.
        env:
          # ImportUsingDbBatchLiveTests needs a CanCreateBatch-capable target; SQLite's
          # SqliteConnection reports false, so the DuckDB.Tests project's own DbBatch coverage
          # depends on this the same way Core/Scaffolding above depend on it.
          JAUNTY_TEST_POSTGRESQL: Host=localhost;Port=5434;Database=northwind;Username=postgres;Password=${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }};
          JAUNTY_REQUIRE_POSTGRESQL: "1"
        run: |
          dotnet test --project tests/Extrode.Jaunty.FlatFiles.Tests -c Release --no-build --framework net8.0 --coverage --coverage-output-format cobertura --report-trx --report-trx-filename test-results-flatfiles.trx
          dotnet test --project tests/Extrode.Jaunty.FlatFiles.DuckDB.Tests -c Release --no-build --framework net8.0 --coverage --coverage-output-format cobertura --report-trx --report-trx-filename test-results-flatfiles-duckdb.trx

      # net10 legs (spec 010 T18): duplicated steps, deliberately NOT a job matrix -
      # the runner is self-hosted and a matrix re-spins the SQL Server service
      # container per leg. These also carry the T13 loader assertion, which fails
      # if a net10 leg silently loads a net8-compiled Extrode.Jaunty.dll.
      # See the net8 Core step above for why JAUNTY_TEST_MYSQL is deliberately absent here
      # (MariaDBAttribute only ever reads MariaDbConnectionString, never MySqlConnectionString)
      # while JAUNTY_REQUIRE_MYSQL still applies (it is MariaDBAttribute's own RequireVariable).
      - name: Test - Core net10 (SQLite + SQL Server + PostgreSQL + MariaDB)
        env:
          JAUNTY_TEST_SQLSERVER: Server=localhost,1435;Database=Northwind;User Id=sa;Password=${{ vars.CI_MSSQL_SA_PASSWORD || format('Ci#{0}xJ', github.run_id) }};TrustServerCertificate=true;
          JAUNTY_TEST_POSTGRESQL: Host=localhost;Port=5434;Database=northwind;Username=postgres;Password=${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }};
          JAUNTY_TEST_MARIADB: Server=localhost;Port=3310;Database=northwind;Uid=root;Pwd=${{ vars.CI_MARIADB_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }};SslMode=Disabled;AllowLoadLocalInfile=true;AllowPublicKeyRetrieval=true
          # The mssql/postgres/mariadb service containers are provisioned above, so an unreachable
          # engine here is a broken job rather than a machine without it. Without these the dialect
          # rows would skip and the leg would report green having tested SQLite only.
          JAUNTY_REQUIRE_SQLSERVER: "1"
          JAUNTY_REQUIRE_POSTGRESQL: "1"
          JAUNTY_REQUIRE_MYSQL: "1"
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Tests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-core-net10.trx

      - name: Test - Core unit net10 (parallel)
        run: >-
          dotnet test --project tests/Extrode.Jaunty.UnitTests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-core-unit-net10.trx

      - name: Test - Source Generator net10 (shape safety)
        run: >-
          dotnet test --project tests/Extrode.Jaunty.SourceGenerator.Tests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-sourcegen-net10.trx

      - name: Test - Fluent net10
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Fluent.Tests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-fluent-net10.trx

      - name: Test - Fluent config state net10
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Fluent.ConfigTests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-fluent-config-net10.trx

      - name: Test - Fluent source-gen net10 (no reflection package reference)
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Fluent.SourceGen.Tests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-fluent-sourcegen-net10.trx

      - name: Test - Scaffolding net10
        env:
          JAUNTY_TEST_SQLSERVER: Server=localhost,1435;Database=Northwind;User Id=sa;Password=${{ vars.CI_MSSQL_SA_PASSWORD || format('Ci#{0}xJ', github.run_id) }};TrustServerCertificate=true;
          JAUNTY_TEST_POSTGRESQL: Host=localhost;Port=5434;Database=northwind;Username=postgres;Password=${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }};
          JAUNTY_TEST_MYSQL: Server=localhost;Port=3309;Database=northwind;Uid=root;Pwd=${{ vars.CI_MYSQL_ROOT_PASSWORD || format('Ci#{0}xJ', github.run_id) }};SslMode=Disabled;AllowLoadLocalInfile=true;AllowPublicKeyRetrieval=true
          JAUNTY_REQUIRE_SQLSERVER: "1"
          JAUNTY_REQUIRE_POSTGRESQL: "1"
          JAUNTY_REQUIRE_MYSQL: "1"
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Scaffolding.Tests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-scaffolding-net10.trx

      - name: Test - Scaffolding CLI net10
        run: >-
          dotnet test --project tests/Extrode.Jaunty.Scaffolding.Cli.Tests
          -c Release
          --no-build
          --framework net10.0
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results-scaffolding-cli-net10.trx

      - name: Test - FlatFiles net10 (DuckDB)
        # See the net8 FlatFiles step above: --project, not --solution + --filter-namespace.
        env:
          JAUNTY_TEST_POSTGRESQL: Host=localhost;Port=5434;Database=northwind;Username=postgres;Password=${{ vars.CI_POSTGRES_PASSWORD || format('Ci#{0}xJ', github.run_id) }};
          JAUNTY_REQUIRE_POSTGRESQL: "1"
        run: |
          dotnet test --project tests/Extrode.Jaunty.FlatFiles.Tests -c Release --no-build --framework net10.0 --coverage --coverage-output-format cobertura --report-trx --report-trx-filename test-results-flatfiles-net10.trx
          dotnet test --project tests/Extrode.Jaunty.FlatFiles.DuckDB.Tests -c Release --no-build --framework net10.0 --coverage --coverage-output-format cobertura --report-trx --report-trx-filename test-results-flatfiles-duckdb-net10.trx

      # Every step above can pass with exit 0 while having silently skipped every test it owns -
      # `dotnet test` does not fail on that by itself. Ported 2026-09-20 from JauntyQ's
      # scripts/skip-audit.js after JauntyQ measured exactly this: an 8-run sample where one run
      # skipped 101 tests across 3 assemblies and exited 0, with no logger recording why. This
      # step reads every trx this job produced and fails if any skip isn't on the allowlist
      # scripts/skip-audit.ps1 keeps for jaunty's own known-legitimate skips.
      - name: Skip audit
        run: pwsh -NoProfile -File scripts/skip-audit.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results-*.trx"
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/coverage.cobertura.xml"
          retention-days: 7

  verify-aot:
    name: Verify NativeAOT Compatibility
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref != 'dev' &&
       github.event.pull_request.head.ref != 'main')
    runs-on: ${{ (github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.fork)
                 && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run NativeAOT verification
        run: pwsh scripts/verify-nativeaot.ps1

  # No duplicate-run condition here, deliberately. `needs` already skips this job
  # when build-and-test is skipped, and an explicit `if` would REPLACE the
  # implicit success() check on that dependency - which would let the publish
  # start after a failed test run.
  aot-publish:
    name: NativeAOT Publish
    runs-on: ${{ (github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.fork)
                 && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install native AOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # PublishAot lives in the Cli csproj. Passing it as -p: makes it a
      # GLOBAL property that flows into referenced projects, and the
      # netstandard2.0 source generator then fails with NETSDK1207
      # (AOT unsupported for that target framework).
      #
      # Two legs since spec 010 (T19): net8 is the CONTROL, net10 the migration
      # under test. -f is now required - the Cli multi-targets net8.0;net10.0,
      # and a framework-less publish of a multi-target project fails outright.
      - name: Publish NativeAOT (net8 control)
        run: >-
          dotnet publish
          src/Extrode.Jaunty.Scaffolding.Cli/Extrode.Jaunty.Scaffolding.Cli.csproj
          -c Release
          -f net8.0
          -r linux-x64
          --self-contained
          -o ./publish-aot-net8

      - name: Publish NativeAOT (net10)
        run: >-
          dotnet publish
          src/Extrode.Jaunty.Scaffolding.Cli/Extrode.Jaunty.Scaffolding.Cli.csproj
          -c Release
          -f net10.0
          -r linux-x64
          --self-contained
          -o ./publish-aot-net10

      - name: Verify AOT binaries
        run: |
          fail=0
          for leg in net8 net10; do
            bin="./publish-aot-$leg/Extrode.Jaunty.Scaffolding.Cli"
            if [ -f "$bin" ]; then
              SIZE=$(stat --format="%s" "$bin")
              SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
              echo "$leg: AOT binary produced, ${SIZE_MB} MB"
            else
              echo "ERROR: $leg AOT binary not found"
              ls -la "./publish-aot-$leg/" || true
              fail=1
            fi
          done
          exit $fail
