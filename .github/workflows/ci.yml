name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The SQL Server service uses a throwaway credential for the ephemeral CI
# container only. Override with the CI_MSSQL_SA_PASSWORD repository variable
# if desired.
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ vars.CI_MSSQL_SA_PASSWORD || 'JauntyCi2026#x' }}
        ports:
          - 1433:1433
        volumes:
          # Mirror the workspace path: BULK INSERT runs server-side and the
          # CSV import tests pass host paths to the server.
          - ${{ github.workspace }}:${{ github.workspace }}
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      CI_SA_CRED: ${{ vars.CI_MSSQL_SA_PASSWORD || 'JauntyCi2026#x' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Bootstrap SQL Server Northwind
        run: |
          docker cp data/sqlserver/create-northwind.sql ${{ job.services.mssql.id }}:/tmp/nw.sql
          docker cp data/sqlserver/create-stored-procedures.sql ${{ job.services.mssql.id }}:/tmp/sp.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_CRED" -C -i /tmp/nw.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$CI_SA_CRED" -C -d Northwind -i /tmp/sp.sql

      - name: Restore
        run: dotnet restore Jaunty.slnx

      - name: Build
        run: dotnet build Jaunty.slnx -c Release --no-restore

      - name: Test - Core (SQLite + SQL Server)
        env:
          JAUNTY_TEST_SQLSERVER: Server=localhost,1433;Database=Northwind;User Id=sa;Password=${{ vars.CI_MSSQL_SA_PASSWORD || 'JauntyCi2026#x' }};TrustServerCertificate=true;
        run: >-
          dotnet test tests/Jaunty.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-core.trx"

      - name: Test - Source Generator (shape safety)
        run: >-
          dotnet test tests/Jaunty.SourceGenerator.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-sourcegen.trx"

      - name: Test - Fluent
        run: >-
          dotnet test tests/Jaunty.Fluent.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-fluent.trx"

      - name: Test - Scaffolding
        run: >-
          dotnet test tests/Jaunty.Scaffolding.Tests
          -c Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-scaffolding.trx"

      - name: Test - FlatFiles (DuckDB)
        run: >-
          dotnet test Jaunty.slnx
          -c Release
          --no-build
          --framework net8.0
          --filter "FullyQualifiedName~Jaunty.FlatFiles"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results-flatfiles.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results-*.trx"
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage.cobertura.xml"
          retention-days: 7

  verify-aot:
    name: Verify NativeAOT Compatibility
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run NativeAOT verification
        run: pwsh scripts/Verify-NativeAOT.ps1

  aot-publish:
    name: NativeAOT Publish
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install native AOT dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # PublishAot lives in the Cli csproj. Passing it as -p: makes it a
      # GLOBAL property that flows into referenced projects, and the
      # netstandard2.0 source generator then fails with NETSDK1207
      # (AOT unsupported for that target framework).
      - name: Publish NativeAOT
        run: >-
          dotnet publish
          src/Jaunty.Scaffolding.Cli/Jaunty.Scaffolding.Cli.csproj
          -c Release
          -r linux-x64
          --self-contained
          -o ./publish-aot

      - name: Verify AOT binary
        run: |
          if [ -f ./publish-aot/Jaunty.Scaffolding.Cli ]; then
            SIZE=$(stat --format="%s" ./publish-aot/Jaunty.Scaffolding.Cli)
            SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
            echo "AOT binary produced successfully"
            echo "Binary size: ${SIZE_MB} MB"
          else
            echo "ERROR: AOT binary not found"
            ls -la ./publish-aot/ || true
            exit 1
          fi
