name: Pages

# Publishes the pre-built documentation site at dist/docs-site to GitHub Pages.
#
# The site is generated by hand and committed, so this workflow builds nothing: it uploads what is
# already in the tree. Regenerate before merging to main with
#
#   dotnet run --project <docsgen> -- docs dist/docs-site --site-name jaunty
#
# main only, on purpose. main is release-only and every merge into it is one a human called, so
# nothing reaches the public site without someone deciding to publish it. That gate matters here
# more than freshness: pages are withheld from this repository by moving their source out of it
# (see docs/06-releases/README.md), and a dev-triggered deploy would publish anything a future
# commit reintroduced without review. workflow_dispatch covers the redeploy-without-a-release case.
on:
  push:
    branches: [main]
    paths:
      - 'dist/docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# contents: read to check out; the other two are what deploy-pages requires to mint the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight - a cancelled deploy can leave the site
# on a partially replaced artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # ubuntu-latest rather than vars.CI_RUNNER. The self-hosted runner is for builds; this job only
    # uploads an artifact and calls the Pages API, so the hosted runner is both sufficient and
    # unaffected by the self-hosted VM's idle-stop.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Fail if a withheld page is present
        # The withheld sources live in the private work repository. If one is ever regenerated into
        # the site, this stops the deploy rather than publishing it.
        run: |
          found=$(ls dist/docs-site \
            | grep -E '^(06-releases-(pricing|COMMERCIAL-|tasklists-)|05-quality-(audit-record|comprehensive-audit)|jaunty-torture-test-)' \
            || true)
          if [ -n "$found" ]; then
            echo "Withheld pages present in dist/docs-site:"
            echo "$found"
            exit 1
          fi
          echo "No withheld pages in dist/docs-site."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs-site

      - id: deployment
        uses: actions/deploy-pages@v5
